[workspace]
members = ["crates/*", "app/src-tauri", "bench"]
default-members = ["crates/core", "crates/audio", "crates/engine", "crates/platform"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
said-core = { path = "crates/core" }
said-audio = { path = "crates/audio" }
said-engine = { path = "crates/engine" }
said-platform = { path = "crates/platform" }
said-bench = { path = "bench" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.dev]
debug = 0
