[workspace]
members = ["crates/core", "crates/audio", "crates/engine", "crates/platform", "app/src-tauri"]
default-members = ["crates/core", "crates/audio", "crates/engine", "crates/platform"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
voice-core = { path = "crates/core" }
voice-audio = { path = "crates/audio" }
voice-engine = { path = "crates/engine" }
voice-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
thiserror = "2"

[profile.dev]
debug = 0
