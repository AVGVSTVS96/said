[package]
name = "said-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
said-core.workspace = true
said-audio = { workspace = true, features = ["native"] }
said-engine.workspace = true
said-bench.workspace = true
said-platform = { workspace = true, features = ["native"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
bzip2 = "0.6"
tar = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }

[[bin]]
name = "said"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"
toml = "1"
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
