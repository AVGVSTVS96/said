[package]
name = "voice-bench"
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace]

[dependencies]
voice-core = { path = "../crates/core" }
voice-engine = { path = "../crates/engine" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[[bin]]
name = "voice"
path = "src/main.rs"

[profile.dev]
debug = 0
