name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  pure:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p voice-core -p voice-audio -p voice-engine -p voice-platform --all-targets -- -D warnings
      - run: cargo test --locked -p voice-core -p voice-audio -p voice-engine -p voice-platform
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run typecheck
        working-directory: app
      - run: bun run build
        working-directory: app
      - run: cargo check --locked -p voice-app
